<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 40" role="img" aria-label="R&D atom delimiter">
  <g fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <!-- nucleus -->
    <circle cx="60" cy="20" r="3.6" fill="currentColor" stroke="none"/>
    <!-- three orbital ellipses -->
    <ellipse cx="60" cy="20" rx="30" ry="11"/>
    <ellipse cx="60" cy="20" rx="30" ry="11" transform="rotate(60 60 20)"/>
    <ellipse cx="60" cy="20" rx="30" ry="11" transform="rotate(-60 60 20)"/>
    <!-- electron dots -->
    <circle cx="90" cy="20" r="2.4" fill="currentColor" stroke="none"/>
    <circle cx="45" cy="33" r="2.0" fill="currentColor" stroke="none"/>
    <circle cx="45" cy="7" r="2.0" fill="currentColor" stroke="none"/>
  </g>
</svg>
